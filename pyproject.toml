[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomate"
version = "0.1.0"
description = "Code If You Can — self-training repo-native coding copilot"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "RepoMate Team"}]
keywords = ["code-copilot", "fine-tuning", "rag", "llm", "code-retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
repomate = "src.cli:app"

[project.optional-dependencies]
core = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "rich>=13.7,<14",
    "typer>=0.12,<1",
]
ingest = [
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10,<2",
    "pathspec>=0.12,<1",
    "tiktoken>=0.7,<1",
]
rag = [
    "chromadb>=0.5,<1",
    "sentence-transformers>=3.0,<4",
    "rank-bm25>=0.2,<1",
]
serve = [
    "openai>=1.30,<2",
]
train = [
    "transformers>=4.41,<5",
    "peft>=0.11,<1",
    "trl>=0.9,<1",
    "accelerate>=0.31,<1",
    "datasets>=2.19,<3",
]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<1",
    "black>=24.4,<25",
    "mypy>=1.10,<2",
]
all = [
    "repomate[core,ingest,rag,serve,train,dev]",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
